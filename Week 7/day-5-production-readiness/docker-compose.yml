# Compose hoàn chỉnh cho project; có thêm kiểm tra readiness của Order Service.
services:
  api-gateway:
    build:
      context: ../project
      dockerfile: api-gateway/Dockerfile
    environment:
      SERVER_PORT: 8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started

  order-service:
    build:
      context: ../project
      dockerfile: order-service/Dockerfile
    environment:
      SERVER_PORT: 8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    expose:
      - "8081"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "http://localhost:8081/actuator/health/readiness" ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  inventory-service:
    build:
      context: ../project
      dockerfile: inventory-service/Dockerfile
    environment:
      SERVER_PORT: 8082
    expose:
      - "8082"

  payment-service:
    build:
      context: ../project
      dockerfile: payment-service/Dockerfile
    environment:
      SERVER_PORT: 8083
    expose:
      - "8083"
